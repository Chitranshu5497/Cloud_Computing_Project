<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartGallery - AI photo labeling</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#4f46e5; --brand2:#7c3aed; --ok:#16a34a; --err:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .hidden{display:none!important}
  button{font:inherit;cursor:pointer}

  /* ---------- Auth screen ---------- */
  #auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
        background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#db2777 100%)}
  .auth-card{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:2rem;
             box-shadow:0 25px 60px rgba(0,0,0,.25)}
  .logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.4rem;margin-bottom:.3rem}
  .logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));
             display:grid;place-items:center;color:#fff;font-size:1.1rem}
  .sub{color:var(--muted);margin:0 0 1.4rem;font-size:.95rem}
  .tabs{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;margin-bottom:1.2rem}
  .tabs button{flex:1;border:0;background:transparent;padding:.55rem;border-radius:9px;color:var(--muted);font-weight:600}
  .tabs button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  label{display:block;font-size:.82rem;font-weight:600;margin:.8rem 0 .3rem}
  input[type=email],input[type=password]{width:100%;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:10px;font:inherit;outline:none}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
  .primary{width:100%;margin-top:1.2rem;padding:.8rem;border:0;border-radius:10px;color:#fff;font-weight:700;
           background:linear-gradient(135deg,var(--brand),var(--brand2));transition:transform .1s,opacity .2s}
  .primary:hover{transform:translateY(-1px)} .primary:disabled{opacity:.6;cursor:wait;transform:none}
  .msg{margin-top:.9rem;font-size:.88rem;color:var(--err);min-height:1.2em}
  .hint{font-size:.78rem;color:var(--muted);margin-top:.3rem}

  /* ---------- App ---------- */
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{max-width:1000px;margin:0 auto;padding:.8rem 1.2rem;display:flex;align-items:center;justify-content:space-between}
  .who{display:flex;align-items:center;gap:.7rem;font-size:.88rem;color:var(--muted)}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
          display:grid;place-items:center;font-weight:700;text-transform:uppercase}
  .ghost{border:1.5px solid var(--line);background:#fff;padding:.4rem .85rem;border-radius:9px;font-weight:600;color:var(--text)}
  .ghost:hover{border-color:var(--brand);color:var(--brand)}
  main{max-width:1000px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
  .hero h2{margin:.2rem 0;font-size:1.6rem} .hero p{margin:0 0 1.2rem;color:var(--muted)}

  .drop{border:2px dashed #c7d2fe;background:#fff;border-radius:18px;padding:2rem 1rem;text-align:center;
        transition:all .2s;cursor:pointer}
  .drop.over,.drop:hover{border-color:var(--brand);background:#eef2ff}
  .drop .big{font-size:2rem;color:var(--brand)}
  .drop b{color:var(--brand)}
  .drop small{display:block;color:var(--muted);margin-top:.3rem}
  .preview{display:flex;gap:1rem;align-items:center;margin-top:1rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.8rem}
  .preview img{width:70px;height:70px;object-fit:cover;border-radius:10px}
  .preview .info{flex:1;min-width:0}
  .preview .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:.5rem}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .2s}
  .status{font-size:.82rem;color:var(--muted);margin-top:.35rem}
  .upbtn{padding:.65rem 1.2rem;border:0;border-radius:10px;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .upbtn:disabled{opacity:.6;cursor:wait}

  .section-head{display:flex;justify-content:space-between;align-items:center;margin:2rem 0 .8rem}
  .section-head h3{margin:0} .count{color:var(--muted);font-size:.9rem}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.1rem}
  .card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);
        transition:transform .2s,box-shadow .2s;cursor:zoom-in;animation:pop .35s ease}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(15,23,42,.12)}
  .card img{width:100%;height:170px;object-fit:cover;display:block;background:#e2e8f0}
  .labels{padding:.8rem}
  .row{margin-bottom:.5rem}
  .row .t{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600}
  .row .t span:last-child{color:var(--muted);font-weight:500}
  .meter{height:5px;background:#eef2ff;border-radius:99px;margin-top:3px;overflow:hidden}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:.5rem}
  .chip{background:#eef2ff;color:#3730a3;border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:600}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem 1rem;background:#fff;border:1px dashed var(--line);border-radius:16px}
  .skeleton{height:280px;border-radius:16px;background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);
            background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}} @keyframes pop{from{opacity:0;transform:scale(.96)}}

  #lightbox{position:fixed;inset:0;background:rgba(15,23,42,.85);display:flex;align-items:center;justify-content:center;
            padding:1rem;z-index:50;cursor:zoom-out}
  #lightbox img{max-width:100%;max-height:90vh;border-radius:14px}
  #toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.7rem 1.2rem;
         border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
  #toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============ APP ============ -->
<section id="app">
  <header><div class="nav">
    <div class="logo" style="margin:0;font-size:1.15rem"><div class="logo-mark" style="width:32px;height:32px">&#9670;</div>SmartGallery</div>
  </div></header>

  <main>
    <div class="hero"><h2>Upload a photo</h2><p>Amazon Rekognition will tell you what is in it. Your results appear in the gallery below.</p></div>

    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      <div class="big">&#8679;</div>
      <div><b>Click to choose</b> or drag and drop an image</div>
      <small>JPEG or PNG</small>
      <input type="file" id="file" accept="image/jpeg,image/png" hidden>
    </div>

    <div class="preview hidden" id="preview">
      <img id="pvImg" alt="">
      <div class="info">
        <div class="name" id="pvName"></div>
        <div class="bar"><i id="pvBar"></i></div>
        <div class="status" id="pvStatus">Ready to upload</div>
      </div>
      <button class="upbtn" id="upBtn" onclick="upload()">Upload</button>
    </div>

    <div class="section-head"><h3>Gallery</h3><span class="count" id="count"></span></div>
    <div id="grid"></div>
  </main>
</section>

<div id="lightbox" class="hidden" onclick="this.classList.add('hidden')"><img id="lbImg" alt=""></div>
<div id="toast"></div>

<script>
const CFG = { api: "__API_URL__" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let chosen = null;

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2800); }

async function api(path, opts={}){ return fetch(CFG.api+path, opts); }

/* ---------- Upload ---------- */
const drop=$("drop"), fileInput=$("file");
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",ev=>pick(ev.dataTransfer.files[0]));
fileInput.addEventListener("change",()=>pick(fileInput.files[0]));

function pick(f){
  if(!f) return;
  if(!["image/jpeg","image/png"].includes(f.type)){ toast("Only JPEG and PNG images are allowed"); return; }
  chosen=f;
  $("pvImg").src=URL.createObjectURL(f); $("pvName").textContent=f.name;
  $("pvBar").style.width="0"; $("pvStatus").textContent="Ready to upload";
  $("upBtn").disabled=false; $("preview").classList.remove("hidden");
}
function resetUpload(){ chosen=null; fileInput.value=""; $("preview").classList.add("hidden"); }

function putWithProgress(url,file){
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest();
    x.open("PUT",url); x.setRequestHeader("Content-Type",file.type);
    x.upload.onprogress=e=>{ if(e.lengthComputable) $("pvBar").style.width=(e.loaded/e.total*100)+"%"; };
    x.onload=()=> x.status<300 ? resolve() : reject(new Error("Upload failed ("+x.status+")"));
    x.onerror=()=>reject(new Error("Network error during upload"));
    x.send(file);
  });
}
async function upload(){
  if(!chosen) return;
  $("upBtn").disabled=true;
  try{
    $("pvStatus").textContent="Preparing secure upload...";
    const r=await api("/upload-url",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contentType:chosen.type})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Could not start upload");
    $("pvStatus").textContent="Uploading to cloud storage...";
    await putWithProgress(data.uploadUrl,chosen);
    $("pvBar").style.width="100%"; $("pvStatus").textContent="Analyzing image with AI...";
    for(let i=0;i<20;i++){                      // poll until labels are ready
      await new Promise(res=>setTimeout(res,1500));
      const items=await loadGallery(false);
      if(items.some(it=>it.imageId===data.key)){ toast("Image analyzed!"); resetUpload(); return; }
    }
    $("pvStatus").textContent="Still processing. Press refresh in a moment."; $("upBtn").disabled=false;
  }catch(e){ $("pvStatus").textContent=e.message; $("upBtn").disabled=false; }
}

/* ---------- Gallery ---------- */
async function loadGallery(showSkeleton){
  if(showSkeleton) $("grid").innerHTML='<div class="skeleton"></div>'.repeat(3);
  const r=await api("/images"); const items=await r.json();
  $("count").textContent=items.length+(items.length===1?" image":" images");
  $("grid").innerHTML = items.length ? items.map(card).join("") :
    '<div class="empty"><div style="font-size:2rem">&#128247;</div>No images yet. Upload your first photo above.</div>';
  return items;
}
function card(i){
  const top=i.labels.slice(0,3), rest=i.labels.slice(3);
  return `<div class="card" onclick="openBox('${esc(i.url)}')">
    <img src="${esc(i.url)}" alt="" loading="lazy">
    <div class="labels">
      ${top.map(l=>`<div class="row"><div class="t"><span>${esc(l.name)}</span><span>${Math.round(l.confidence)}%</span></div>
        <div class="meter"><i style="width:${Math.round(l.confidence)}%"></i></div></div>`).join("")}
      ${rest.length?`<div class="chips">${rest.map(l=>`<span class="chip">${esc(l.name)}</span>`).join("")}</div>`:""}
    </div></div>`;
}
function openBox(u){ $("lbImg").src=u; $("lightbox").classList.remove("hidden"); }

loadGallery(true);
</script>
</body>
</html>
